spring:
  application:
    name: expense-tracker

  # ${ENV_VAR:default} -> reads an environment variable, falls back to the default.
  # Defaults match docker-compose.yml so it works out of the box locally.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
    username: ${DB_USERNAME:expense_user}
    password: ${DB_PASSWORD:expense_pass}

  jpa:
    hibernate:
      # Flyway creates the tables; Hibernate only CHECKS that entities match them.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
